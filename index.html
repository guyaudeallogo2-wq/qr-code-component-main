<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <meta name="description" content="A qr code website">
  <meta name="author" content="Guyaude ALLOGO">
  <meta name="language" content="english">
  <!-- Open Graph -->
  <meta property="og:title" content="Qr code website">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://example.com">
  <meta property="og:image" content="https://example.com/images/preview.jpg">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <section>
    <img src="images/image-qr-code.png" alt="QR code linking to Frontend Mentor">
    <h3 class="first-paragraph">Improve your front-end skills by building projects</h3>

  <p class="second-paragraph">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </section>

  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Guyaude ALLOGO</a>.
  </footer>
</body>
</html>
